databases:
  - name: odoo20-db
    plan: free
    databaseName: odoo20
    user: odoo

services:
  - type: web
    name: odoo20-unicah
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: odoo20-db
          property: connectionString
      - key: ODOO_ADMIN_PASSWORD
        value: Unicah2026*
